name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: clang
  CXX: clang++

jobs:
  lint:
    name: Format and includes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format clang-tidy ninja-build

      - name: Check formatting
        run: |
          find projects \( -name '*.cpp' -o -name '*.hpp' \) -print0 |
            xargs -0 clang-format --dry-run --Werror

      - name: Configure
        run: cmake --preset debug

      - name: Check includes
        run: |
          find projects -name '*.cpp' -print0 |
            xargs -0 clang-tidy -p build/debug --quiet

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Cache the official tool suite
        id: tools
        uses: actions/cache@v4
        with:
          path: tools
          key: nand2tetris-tools-2.6

      - name: Fetch the official tool suite
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/n2t.zip \
            https://github.com/itoshkov/nand2tetris-emu/releases/download/original-2.6/nand2tetris.zip
          echo "f4ea1e104c9296f98d5b3ebd30acc283a876fedcf289f7679ad80885902bebe4  /tmp/n2t.zip" |
            sha256sum -c
          unzip -q /tmp/n2t.zip -d /tmp/n2t
          cp -R /tmp/n2t/nand2tetris/tools .

      - name: Fetch the course programs
        run: |
          chmod +x tools/*.sh
          git clone --depth 1 https://github.com/nand2tetris/projects.git /tmp/n2t-projects
          scripts/copy_course.sh /tmp/n2t-projects/projects

      - name: Build
        run: |
          cmake --preset debug
          cmake --build --preset debug

      - name: Test
        run: ctest --preset debug --exclude-regex '^Translate\.'
